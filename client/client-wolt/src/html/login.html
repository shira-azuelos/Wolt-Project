<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolt - כניסה</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/login.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <nav class="auth-nav">
            </nav>
        </div>
        <div class="header-center">
            <div class="wolt-logo">Wolt</div>
        </div>
    </header>
    <main class="container auth-page-container">
        <div class="auth-box">
            <h2>כניסה</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">אימייל:</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">סיסמה:</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" class="auth-btn">היכנס</button>
            </form>
            <p class="auth-switch-link">אין לך חשבון? <a href="register.html">הירשם כאן</a></p>
        </div>
    </main>
</body>
</html>
