<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolt - סל הקניות שלך</title>
    <link rel="stylesheet" href="../css/checkout.css">
    <link rel="stylesheet" href="../css/basketP.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/checkout.js" defer></script>
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <a href="../html/basketP.html" class="back-link">
                <i class="fas fa-chevron-right"></i> חזרה לסל
            </a>
        </div>
        <div class="header-right">
            <div class="wolt-logo">Wolt</div>
        </div>
    </header>
    <main class="container">
        <h1 class="section-title">סיכום הזמנה</h1>
        <div id="cart-list" class="cart-grid">
            </div>
        <div class="cart-summary-container">
            <div id="total-price" class="total-price">
                <h2>סה"כ לתשלום: ₪<span id="total-amount">0</span></h2>
            </div>
        </div>

        <section class="payment-section">
            <h2 class="section-title">פרטי תשלום</h2>
            <form id="payment-form">
                <div class="form-group">
                    <label for="card-number">מספר כרטיס:</label>
                    <input type="text" id="card-number" placeholder="XXXX-XXXX-XXXX-XXXX" required>
                </div>
                <div class="form-group">
                    <label for="card-name">שם מלא:</label>
                    <input type="text" id="card-name" placeholder="שם בעל הכרטיס" required>
                </div>
                <div class="form-group">
                    <label for="card-expiry">תוקף:</label>
                    <input type="text" id="card-expiry" placeholder="MM/YY" required>
                </div>
                <div class="form-group">
                    <label for="card-cvv">קוד אבטחה (CVV):</label>
                    <input type="text" id="card-cvv" placeholder="XXX" required>
                </div>
                <button type="submit" id="confirm-payment-btn" class="checkout-btn">אשר תשלום</button>
            </form>
        </section>
    </main>
</body>
</html>
