<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/client.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script  src="../js/client.js" defer></script>
 
    <title>Document</title>
</head>
<body>
    <div class="notification">
        <span class="icon">🚚</span>
        <span class="message">ההזמנה הסתימה בהצלחה. האם תרצה להגיב?</span>
        <button id="continue-button">כן</button>
    </div>
    
    <div id="notifications" style="display: none;"></div>
    <div id="rating-container" style="display: none;">
        <div id="rating">
            <span class="star" data-value="1">&#9733;</span>
            <span class="star" data-value="2">&#9733;</span>
            <span class="star" data-value="3">&#9733;</span>
            <span class="star" data-value="4">&#9733;</span>
            <span class="star" data-value="5">&#9733;</span>
        </div>
        <textarea id="comment" placeholder="Leave your comment here..."></textarea>
        <button id="submit">Submit</button>
    </div>
</body>
</html>
