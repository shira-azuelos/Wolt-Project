<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolt - הרשמה</title>
    <link rel="stylesheet" href="../css/register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/register.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="header-center">
            <div class="wolt-logo">Wolt</div>
        </div>
    </header>

    <main class="container auth-page-container">
    <div class="auth-box">
        <h2>הרשמה</h2>
        <form id="register-form">
    <div class="form-group">
        <label for="reg-firstname">שם פרטי:</label>
        <input type="text" id="reg-firstname" required>
    </div>
    <div class="form-group">
        <label for="reg-lastname">שם משפחה:</label>
        <input type="text" id="reg-lastname" required>
    </div>
    <div class="form-group">
        <label for="reg-email">אימייל:</label>
        <input type="email" id="reg-email" required>
    </div>
    <div class="form-group">
        <label for="reg-password">סיסמה:</label>
        <input type="password" id="reg-password" required>
    </div>
    <div class="form-group">
        <label for="reg-address">כתובת (רחוב, עיר):</label>
        <input type="text" id="reg-address" required>
    </div>
    <div class="form-group">
        <label for="reg-phone">טלפון:</label>
        <input type="text" id="reg-phone" required>
    </div>
    <button type="submit" class="auth-btn">הירשם</button>
</form>
        <p class="auth-switch-link">כבר יש לך חשבון? <a href="login.html">התחבר כאן</a></p>
    </div>
</main>
</body>
</html>
